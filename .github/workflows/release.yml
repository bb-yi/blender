name: Blender NPR Port Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag name to upload assets to'
        required: true

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Get Short Hash & Date
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install build-essential subversion libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libegl-dev
          sudo apt-get install libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev linux-libc-dev
          sudo apt-get install gcc-14 g++-14

          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Setup Git LFS
        run: |
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git config lfs.remote.searchall false
          git lfs install

      - name: Blender Make Update
        run: make update

      - name: Download Extra Assets
        run: |
          curl -L -o release/datafiles/splash.png https://github.com/bb-yi/blender/raw/refs/heads/npr-port-5.1/release/datafiles/splash.png
          curl -L -o assets/nodes/npr_node_groups.blend https://github.com/bb-yi/blender/raw/refs/heads/npr-port-5.1/assets/nodes/npr_node_groups.blend

      - name: Build Blender Release
        run: make release ninja

      - name: Package Release Asset
        run: |
          VERSION="5.1.1"
          HASH="${{ steps.vars.outputs.sha_short }}"
          DATE="${{ steps.vars.outputs.build_date }}"
          ASSET_NAME="blender-$VERSION-npr-port-linux64-$HASH-$DATE"
          TAR_FILE="$ASSET_NAME.tar.xz"
          BUILD_DIR="../build_linux_release/bin"
          
          mkdir -p "$ASSET_NAME"
          cp -r "$BUILD_DIR"/* "$ASSET_NAME/"
          
          tar -cvJf "$TAR_FILE" "$ASSET_NAME"
          echo "TAR_PATH=$TAR_FILE" >> $GITHUB_ENV

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-asset
          path: ${{ env.TAR_PATH }}

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Get Short Hash & Date
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Setup Git LFS
        run: |
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git config lfs.remote.searchall false
          git lfs install

      - name: Blender Make Update
        run: make update

      - name: Download Extra Assets
        run: |
          curl -L -o release/datafiles/splash.png https://github.com/bb-yi/blender/raw/refs/heads/npr-port-5.1/release/datafiles/splash.png
          curl -L -o assets/nodes/npr_node_groups.blend https://github.com/bb-yi/blender/raw/refs/heads/npr-port-5.1/assets/nodes/npr_node_groups.blend

      - name: Build Blender Release
        run: make release ninja

      - name: Package Release Asset
        run: |
          VERSION="5.1.1"
          HASH="${{ steps.vars.outputs.sha_short }}"
          DATE="${{ steps.vars.outputs.build_date }}"
          ASSET_NAME="blender-$VERSION-npr-port-macos-$HASH-$DATE"
          DMG_FILE="$ASSET_NAME.dmg"
          APP_BUNDLE=$(find ../build_darwin_release -name "Blender.app" -type d | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "Blender.app not found!"
            exit 1
          fi
          hdiutil create -format UDZO -srcfolder "$APP_BUNDLE" "$DMG_FILE"
          echo "DMG_PATH=$DMG_FILE" >> $GITHUB_ENV

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-asset
          path: ${{ env.DMG_PATH }}

  publish:
    name: Upload Assets to Existing Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag was provided." >&2
            exit 1
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Ensure Release Exists
        run: gh release view "${{ steps.vars.outputs.tag_name }}" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Assets to Release
        run: gh release upload "${{ steps.vars.outputs.tag_name }}" artifacts/* --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
