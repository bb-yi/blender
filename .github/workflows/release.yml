name: Blender NPR Port Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag name to upload assets to'
        required: true

jobs:
  release-state:
    name: Check Existing Platform Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_required: ${{ steps.state.outputs.build_required }}
    steps:
      - name: Check Tag and Existing Release Assets
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo, tag = os.environ['GH_REPO'], os.environ['RELEASE_TAG']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          ref = api(f'git/ref/tags/{tag}')['object']
          for _ in range(4):
              if ref['type'] == 'commit':
                  break
              if ref['type'] != 'tag':
                  raise RuntimeError('Release tag does not resolve to a commit')
              ref = api('git/tags/' + ref['sha'])['object']
          assert ref['type'] == 'commit', 'Nested release tag did not resolve'
          commit = ref['sha']
          if os.environ['RELEASE_EVENT'] == 'workflow_dispatch':
              # Read-only job tokens cannot see private drafts. A manual request always
              # builds; the write-enabled upload job checks that the draft exists.
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  print('build_required=true', file=output)
              print(json.dumps({'commit': commit, 'build_required': True, 'reason': 'manual request'}))
              raise SystemExit(0)
          release_id = subprocess.check_output([
              'gh', 'release', 'view', tag, '--repo', repo,
              '--json', 'databaseId', '--jq', '.databaseId'], text=True).strip()
          assert release_id.isdigit(), 'Release lookup did not return an ID'
          release = api('releases/' + release_id)
          assert release['tag_name'] == tag, 'Release tag changed during lookup'
          match = re.match(r'v(\d+\.\d+\.\d+)', tag)
          expected = [('win64', '.zip'), ('linux64', '.tar.xz'), ('macos', '.dmg')]
          complete = bool(match)
          for platform, suffix in expected:
              prefix = f'blender-{match[1] if match else "unknown"}-npr-port-{platform}-{commit[:12]}-'
              assets = [a for a in release['assets'] if a['name'].startswith(prefix) and a['name'].endswith(suffix)]
              complete &= len(assets) == 1 and assets[0]['state'] == 'uploaded' and assets[0]['size'] > 0 and bool(re.fullmatch(r'sha256:[0-9a-f]{64}', assets[0].get('digest') or ''))
          required = not complete
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('build_required=' + str(required).lower(), file=output)
          print(json.dumps({'commit': commit, 'platform_assets_complete': bool(complete), 'build_required': required}))
          PY

  build-linux:
    needs: release-state
    if: needs.release-state.outputs.build_required == 'true'
    name: Build Linux x64
    runs-on: ubuntu-24.04
    container:
      image: rockylinux/rockylinux:9
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: write
    env:
      BUILD_CMAKE_ARGS: -DSYCL_CPP_FLAGS=--gcc-toolchain=/opt/rh/gcc-toolset-14/root/usr
    steps:
      - name: Install Dependencies
        run: |
          dnf -y update
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install \
            gcc-toolset-14 \
            make cmake ninja-build git git-lfs python3 rsync patch subversion tar xz wget \
            libSM libSM-devel libICE libICE-devel \
            libX11-devel libXxf86vm libXcursor-devel libXi-devel libXrandr-devel libXinerama-devel \
            libglvnd-devel mesa-libEGL-devel mesa-libGL-devel mesa-libGLU-devel \
            libXext-devel libXrender-devel libXfixes-devel \
            wayland-devel wayland-protocols-devel libxkbcommon-devel dbus-devel

      - name: Enable GCC Toolset
        run: |
          echo "PATH=/opt/rh/gcc-toolset-14/root/usr/bin:/opt/rh/gcc-toolset-14/root/usr/sbin:$PATH" >> "$GITHUB_ENV"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: blender
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Get Short Hash & Date
        working-directory: blender
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short=12 HEAD)" >> $GITHUB_OUTPUT
          echo "sha_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Setup Git LFS
        working-directory: blender
        run: |
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git config lfs.remote.searchall false
          git lfs install

      - name: Blender Make Update
        working-directory: blender
        run: make update

      - name: Download Extra Assets
        working-directory: blender
        run: |
          curl --fail --location --retry 3 --output release/datafiles/splash.png "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.vars.outputs.sha_full }}/release/datafiles/splash.png"
          curl --fail --location --retry 3 --output assets/nodes/npr_node_groups.blend "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.vars.outputs.sha_full }}/assets/nodes/npr_node_groups.blend"

      - name: Build Blender Release
        working-directory: blender
        run: make release ninja

      - name: Package Release Asset
        working-directory: blender
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path

          header = Path("source/blender/blenkernel/BKE_blender_version.h").read_text()
          version = int(re.search(r"^#define BLENDER_VERSION\s+(\d+)$", header, re.M).group(1))
          patch = int(re.search(r"^#define BLENDER_VERSION_PATCH\s+(\d+)$", header, re.M).group(1))
          print(f"{version // 100}.{version % 100}.{patch}")
          PY
          )
          HASH="${{ steps.vars.outputs.sha_short }}"
          DATE="${{ steps.vars.outputs.build_date }}"
          ASSET_NAME="blender-$VERSION-npr-port-linux64-$HASH-$DATE"
          TAR_FILE="$ASSET_NAME.tar.xz"
          BUILD_DIR="../build_linux_release/bin"
          
          mkdir -p "$ASSET_NAME"
          cp -r "$BUILD_DIR"/* "$ASSET_NAME/"
          
          tar -cvJf "$TAR_FILE" "$ASSET_NAME"
          tar -tJf "$TAR_FILE" >/dev/null
          CHECK="$RUNNER_TEMP/npr-linux-package"
          mkdir -p "$CHECK"
          tar -xJf "$TAR_FILE" -C "$CHECK"
          cmp "$BUILD_DIR/blender" "$CHECK/$ASSET_NAME/blender"
          export NPR_RELEASE_EXPECTED_COMMIT="${{ steps.vars.outputs.sha_full }}"
          test "$(git rev-parse HEAD)" = "$NPR_RELEASE_EXPECTED_COMMIT"
          SANDBOX="$RUNNER_TEMP/npr-release-smoke"
          mkdir -p "$SANDBOX"/{resources,config,scripts,datafiles,extensions,temp}
          export BLENDER_USER_RESOURCES="$SANDBOX/resources" BLENDER_USER_CONFIG="$SANDBOX/config"
          export BLENDER_USER_SCRIPTS="$SANDBOX/scripts" BLENDER_USER_DATAFILES="$SANDBOX/datafiles"
          export BLENDER_USER_EXTENSIONS="$SANDBOX/extensions" TEMP="$SANDBOX/temp" TMP="$SANDBOX/temp" TMPDIR="$SANDBOX/temp"
          "$CHECK/$ASSET_NAME/blender" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 1 --python .github/scripts/release_program_smoke.py
          echo "TAR_PATH=$TAR_FILE" >> $GITHUB_ENV

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-asset
          path: blender/${{ env.TAR_PATH }}

  build-macos:
    needs: release-state
    if: needs.release-state.outputs.build_required == 'true'
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Get Short Hash & Date
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short=12 HEAD)" >> $GITHUB_OUTPUT
          echo "sha_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Setup Git LFS
        run: |
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git config lfs.remote.searchall false
          git lfs install

      - name: Blender Make Update
        run: make update

      - name: Download Extra Assets
        run: |
          curl --fail --location --retry 3 --output release/datafiles/splash.png "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.vars.outputs.sha_full }}/release/datafiles/splash.png"
          curl --fail --location --retry 3 --output assets/nodes/npr_node_groups.blend "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.vars.outputs.sha_full }}/assets/nodes/npr_node_groups.blend"

      - name: Build Blender Release
        run: make release ninja

      - name: Package Release Asset
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path

          header = Path("source/blender/blenkernel/BKE_blender_version.h").read_text()
          version = int(re.search(r"^#define BLENDER_VERSION\s+(\d+)$", header, re.M).group(1))
          patch = int(re.search(r"^#define BLENDER_VERSION_PATCH\s+(\d+)$", header, re.M).group(1))
          print(f"{version // 100}.{version % 100}.{patch}")
          PY
          )
          HASH="${{ steps.vars.outputs.sha_short }}"
          DATE="${{ steps.vars.outputs.build_date }}"
          ASSET_NAME="blender-$VERSION-npr-port-macos-$HASH-$DATE"
          DMG_FILE="$ASSET_NAME.dmg"
          APP_BUNDLE=$(find ../build_darwin_release -name "Blender.app" -type d | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "Blender.app not found!"
            exit 1
          fi
          STAGING="$RUNNER_TEMP/npr-dmg-root"
          mkdir -p "$STAGING"
          ditto "$APP_BUNDLE" "$STAGING/Blender.app"
          hdiutil create -format UDZO -srcfolder "$STAGING" "$DMG_FILE"
          hdiutil verify "$DMG_FILE"
          MOUNT="$RUNNER_TEMP/npr-package-volume"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG_FILE"
          trap 'hdiutil detach "$MOUNT"' EXIT
          export NPR_RELEASE_EXPECTED_COMMIT="${{ steps.vars.outputs.sha_full }}"
          test "$(git rev-parse HEAD)" = "$NPR_RELEASE_EXPECTED_COMMIT"
          SANDBOX="$RUNNER_TEMP/npr-release-smoke"
          mkdir -p "$SANDBOX"/{resources,config,scripts,datafiles,extensions,temp}
          export BLENDER_USER_RESOURCES="$SANDBOX/resources" BLENDER_USER_CONFIG="$SANDBOX/config"
          export BLENDER_USER_SCRIPTS="$SANDBOX/scripts" BLENDER_USER_DATAFILES="$SANDBOX/datafiles"
          export BLENDER_USER_EXTENSIONS="$SANDBOX/extensions" TEMP="$SANDBOX/temp" TMP="$SANDBOX/temp" TMPDIR="$SANDBOX/temp"
          "$MOUNT/Blender.app/Contents/MacOS/Blender" --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 1 --python .github/scripts/release_program_smoke.py
          echo "DMG_PATH=$DMG_FILE" >> $GITHUB_ENV

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-asset
          path: ${{ env.DMG_PATH }}

  publish:
    name: Upload Assets to Existing Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag was provided." >&2
            exit 1
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Ensure Release Exists
        run: gh release view "${{ steps.vars.outputs.tag_name }}" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Assets to Release
        run: gh release upload "${{ steps.vars.outputs.tag_name }}" artifacts/* --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
