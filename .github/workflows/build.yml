name: Blender NPR Port Build

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    container:
      image: rockylinux/rockylinux:9
    permissions:
      contents: read
    env:
      BUILD_CMAKE_ARGS: -DSYCL_CPP_FLAGS=--gcc-toolchain=/opt/rh/gcc-toolset-14/root/usr
    steps:
      - name: Install Dependencies
        run: |
          dnf -y update
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install \
            gcc-toolset-14 \
            make cmake ninja-build git git-lfs python3 rsync patch subversion tar xz wget \
            libSM libSM-devel libICE libICE-devel \
            libX11-devel libXxf86vm libXcursor-devel libXi-devel libXrandr-devel libXinerama-devel \
            libglvnd-devel mesa-libEGL-devel mesa-libGL-devel mesa-libGLU-devel \
            libXext-devel libXrender-devel libXfixes-devel \
            wayland-devel wayland-protocols-devel libxkbcommon-devel dbus-devel

      - name: Enable GCC Toolset
        run: |
          echo "PATH=/opt/rh/gcc-toolset-14/root/usr/bin:/opt/rh/gcc-toolset-14/root/usr/sbin:$PATH" >> "$GITHUB_ENV"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          path: blender
          persist-credentials: false

      - name: Get Short Hash & Date
        working-directory: blender
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Setup Git LFS
        working-directory: blender
        run: |
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git config lfs.remote.searchall false
          git lfs install

      - name: Blender Make Update
        working-directory: blender
        run: make update

      - name: Download Extra Assets
        working-directory: blender
        run: |
          curl -L -o release/datafiles/splash.png https://github.com/bb-yi/blender/raw/refs/heads/main/release/datafiles/splash.png
          curl -L -o assets/nodes/npr_node_groups.blend https://github.com/bb-yi/blender/raw/refs/heads/main/assets/nodes/npr_node_groups.blend

      - name: Build Blender Release
        working-directory: blender
        run: make release ninja

      - name: Package Release Asset
        working-directory: blender
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path

          header = Path("source/blender/blenkernel/BKE_blender_version.h").read_text()
          version = int(re.search(r"^#define BLENDER_VERSION\s+(\d+)$", header, re.M).group(1))
          patch = int(re.search(r"^#define BLENDER_VERSION_PATCH\s+(\d+)$", header, re.M).group(1))
          print(f"{version // 100}.{version % 100}.{patch}")
          PY
          )
          HASH="${{ steps.vars.outputs.sha_short }}"
          DATE="${{ steps.vars.outputs.build_date }}"
          ASSET_NAME="blender-$VERSION-npr-port-linux64-$HASH-$DATE"
          TAR_FILE="$ASSET_NAME.tar.xz"
          BUILD_DIR="../build_linux_release/bin"
          
          mkdir -p "$ASSET_NAME"
          cp -r "$BUILD_DIR"/* "$ASSET_NAME/"
          
          tar -cvJf "$TAR_FILE" "$ASSET_NAME"
          echo "TAR_PATH=$TAR_FILE" >> $GITHUB_ENV

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-asset
          path: blender/${{ env.TAR_PATH }}

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get Short Hash & Date
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Setup Git LFS
        run: |
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git config lfs.remote.searchall false
          git lfs install

      - name: Blender Make Update
        run: make update

      - name: Download Extra Assets
        run: |
          curl -L -o release/datafiles/splash.png https://github.com/bb-yi/blender/raw/refs/heads/main/release/datafiles/splash.png
          curl -L -o assets/nodes/npr_node_groups.blend https://github.com/bb-yi/blender/raw/refs/heads/main/assets/nodes/npr_node_groups.blend

      - name: Build Blender Release
        run: make release ninja

      - name: Package Release Asset
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path

          header = Path("source/blender/blenkernel/BKE_blender_version.h").read_text()
          version = int(re.search(r"^#define BLENDER_VERSION\s+(\d+)$", header, re.M).group(1))
          patch = int(re.search(r"^#define BLENDER_VERSION_PATCH\s+(\d+)$", header, re.M).group(1))
          print(f"{version // 100}.{version % 100}.{patch}")
          PY
          )
          HASH="${{ steps.vars.outputs.sha_short }}"
          DATE="${{ steps.vars.outputs.build_date }}"
          ASSET_NAME="blender-$VERSION-npr-port-macos-$HASH-$DATE"
          DMG_FILE="$ASSET_NAME.dmg"
          APP_BUNDLE=$(find ../build_darwin_release -name "Blender.app" -type d | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "Blender.app not found!"
            exit 1
          fi
          hdiutil create -format UDZO -srcfolder "$APP_BUNDLE" "$DMG_FILE"
          echo "DMG_PATH=$DMG_FILE" >> $GITHUB_ENV

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-asset
          path: ${{ env.DMG_PATH }}

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get Short Hash & Date
        id: vars
        shell: pwsh
        run: |
          "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT
          "build_date=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_OUTPUT

      - name: Setup Git LFS
        shell: pwsh
        run: |
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git config lfs.remote.searchall false
          git lfs install

      - name: Download Windows Libraries
        shell: pwsh
        run: |
          git config --local "submodule.lib/windows_x64.update" checkout
          git submodule update --progress --init lib/windows_x64
          git -C lib/windows_x64 config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git -C lib/windows_x64 config lfs.remote.searchall false
          git -C lib/windows_x64 lfs install --local
          git -C lib/windows_x64 lfs pull

      - name: Blender Make Update
        shell: cmd
        run: make.bat update

      - name: Download Extra Assets
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/bb-yi/blender/raw/refs/heads/main/release/datafiles/splash.png" -OutFile "release/datafiles/splash.png"
          Invoke-WebRequest -Uri "https://github.com/bb-yi/blender/raw/refs/heads/main/assets/nodes/npr_node_groups.blend" -OutFile "assets/nodes/npr_node_groups.blend"

      - name: Build Blender Release
        shell: cmd
        run: make.bat release x64 2022

      - name: Package Release Asset
        shell: pwsh
        run: |
          $Header = Get-Content -Raw -LiteralPath "source/blender/blenkernel/BKE_blender_version.h"
          $BaseVersion = [int]([regex]::Match($Header, "(?m)^#define BLENDER_VERSION\s+(\d+)\s*$").Groups[1].Value)
          $PatchVersion = [int]([regex]::Match($Header, "(?m)^#define BLENDER_VERSION_PATCH\s+(\d+)\s*$").Groups[1].Value)
          $Version = "{0}.{1}.{2}" -f [math]::Floor($BaseVersion / 100), ($BaseVersion % 100), $PatchVersion
          $Hash = "${{ steps.vars.outputs.sha_short }}"
          $Date = "${{ steps.vars.outputs.build_date }}"
          $AssetName = "blender-$Version-npr-port-win64-$Hash-$Date"
          $ZipFile = "$AssetName.zip"

          $InstallDir = Get-ChildItem -Path ".." -Directory -Filter "build_windows*" |
            ForEach-Object { Join-Path $_.FullName "bin/Release" } |
            Where-Object { Test-Path (Join-Path $_ "blender.exe") } |
            Select-Object -First 1

          if (-not $InstallDir) {
            throw "Installed Windows build output not found."
          }

          Compress-Archive -Path (Join-Path $InstallDir "*") -DestinationPath $ZipFile -CompressionLevel Optimal
          "ZIP_PATH=$ZipFile" >> $env:GITHUB_ENV

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-asset
          path: ${{ env.ZIP_PATH }}
