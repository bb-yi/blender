name: Blender NPR Port Build

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get Short Hash & Date
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          retry() {
            local attempts=5
            local delay=20
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "Command failed after $attempts attempts: $*" >&2
                return 1
              fi
              echo "Command failed, retrying in ${delay}s ($n/$attempts): $*" >&2
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          retry sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          retry sudo apt-get update
          retry sudo apt-get install -y build-essential subversion libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libegl-dev
          retry sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev linux-libc-dev
          retry sudo apt-get install -y gcc-14 g++-14

          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Setup Git LFS
        run: |
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git config lfs.remote.searchall false
          git lfs install

      - name: Blender Make Update
        run: make update

      - name: Download Extra Assets
        run: |
          curl -L -o release/datafiles/splash.png https://github.com/bb-yi/blender/raw/refs/heads/npr-port-5.1/release/datafiles/splash.png
          curl -L -o assets/nodes/npr_node_groups.blend https://github.com/bb-yi/blender/raw/refs/heads/npr-port-5.1/assets/nodes/npr_node_groups.blend

      - name: Build Blender Release
        run: make release ninja

      - name: Package Release Asset
        run: |
          VERSION="5.1.0"
          HASH="${{ steps.vars.outputs.sha_short }}"
          DATE="${{ steps.vars.outputs.build_date }}"
          ASSET_NAME="blender-$VERSION-npr-port-linux64-$HASH-$DATE"
          TAR_FILE="$ASSET_NAME.tar.xz"
          BUILD_DIR="../build_linux_release/bin"
          
          mkdir -p "$ASSET_NAME"
          cp -r "$BUILD_DIR"/* "$ASSET_NAME/"
          
          tar -cvJf "$TAR_FILE" "$ASSET_NAME"
          echo "TAR_PATH=$TAR_FILE" >> $GITHUB_ENV

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-asset
          path: ${{ env.TAR_PATH }}

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get Short Hash & Date
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Setup Git LFS
        run: |
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git config lfs.remote.searchall false
          git lfs install

      - name: Blender Make Update
        run: make update

      - name: Download Extra Assets
        run: |
          curl -L -o release/datafiles/splash.png https://github.com/bb-yi/blender/raw/refs/heads/npr-port-5.1/release/datafiles/splash.png
          curl -L -o assets/nodes/npr_node_groups.blend https://github.com/bb-yi/blender/raw/refs/heads/npr-port-5.1/assets/nodes/npr_node_groups.blend

      - name: Build Blender Release
        run: make release ninja

      - name: Package Release Asset
        run: |
          VERSION="5.1.0"
          HASH="${{ steps.vars.outputs.sha_short }}"
          DATE="${{ steps.vars.outputs.build_date }}"
          ASSET_NAME="blender-$VERSION-npr-port-macos-$HASH-$DATE"
          DMG_FILE="$ASSET_NAME.dmg"
          APP_BUNDLE=$(find ../build_darwin_release -name "Blender.app" -type d | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "Blender.app not found!"
            exit 1
          fi
          hdiutil create -format UDZO -srcfolder "$APP_BUNDLE" "$DMG_FILE"
          echo "DMG_PATH=$DMG_FILE" >> $GITHUB_ENV

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-asset
          path: ${{ env.DMG_PATH }}

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get Short Hash & Date
        id: vars
        shell: pwsh
        run: |
          "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT
          "build_date=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_OUTPUT

      - name: Setup Git LFS
        shell: pwsh
        run: |
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git config lfs.remote.searchall false
          git lfs install

      - name: Download Windows Libraries
        shell: pwsh
        run: |
          git config --local "submodule.lib/windows_x64.update" checkout
          git submodule update --progress --init lib/windows_x64
          git -C lib/windows_x64 config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git -C lib/windows_x64 config lfs.remote.searchall false
          git -C lib/windows_x64 lfs install --local
          git -C lib/windows_x64 lfs pull

      - name: Blender Make Update
        shell: cmd
        run: make.bat update

      - name: Download Extra Assets
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/bb-yi/blender/raw/refs/heads/npr-port-5.1/release/datafiles/splash.png" -OutFile "release/datafiles/splash.png"
          Invoke-WebRequest -Uri "https://github.com/bb-yi/blender/raw/refs/heads/npr-port-5.1/assets/nodes/npr_node_groups.blend" -OutFile "assets/nodes/npr_node_groups.blend"

      - name: Build Blender Release
        shell: cmd
        run: make.bat release x64 2022

      - name: Package Release Asset
        shell: pwsh
        run: |
          $Version = "5.1.0"
          $Hash = "${{ steps.vars.outputs.sha_short }}"
          $Date = "${{ steps.vars.outputs.build_date }}"
          $AssetName = "blender-$Version-npr-port-win64-$Hash-$Date"
          $ZipFile = "$AssetName.zip"

          $InstallDir = Get-ChildItem -Path ".." -Directory -Filter "build_windows*" |
            ForEach-Object { Join-Path $_.FullName "bin/Release" } |
            Where-Object { Test-Path (Join-Path $_ "blender.exe") } |
            Select-Object -First 1

          if (-not $InstallDir) {
            throw "Installed Windows build output not found."
          }

          Compress-Archive -Path (Join-Path $InstallDir "*") -DestinationPath $ZipFile -CompressionLevel Optimal
          "ZIP_PATH=$ZipFile" >> $env:GITHUB_ENV

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-asset
          path: ${{ env.ZIP_PATH }}
