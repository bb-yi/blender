site_name: Blender 5.2 LTS NPR Port 文档
site_description: Blender 5.2 LTS NPR Port 功能、使用与版本说明
site_author: NPR Port Team
site_url: "https://bb-yi.github.io/blender/"

docs_dir: docs/zh

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: red
      toggle:
        icon: material/brightness-7
        name: 深色模式
    - scheme: slate
      primary: indigo
      accent: red
      toggle:
        icon: material/brightness-4
        name: 亮色模式
  features:
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - 首页: index.md
  - 下载与版本: release.md
  - 扩展着色器节点: extended-nodes.md
  - NPR Tree 工作流: npr-workflow.md
  - 界面与设置: interface-guide.md
  - Scene 级 Eevee 扩展: scene-extensions.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

use_directory_urls: false

plugins:
  - search:
      lang: zh

extra:
  alternate:
    - name: 中文
      lang: zh
      link: /blender/
    - name: English
      lang: en
      link: /blender/en/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bb-yi/blender
