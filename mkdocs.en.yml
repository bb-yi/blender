site_name: Blender 5.1 NPR Port Documentation
site_description: Blender 5.1 NPR Port Features & Usage Guide
site_author: NPR Port Team
site_url: "https://bb-yi.github.io/blender/en/"

docs_dir: docs/en

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: red
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: red
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - Home: index.md
  - Extended Nodes: extended-nodes.md
  - NPR Workflow: npr-workflow.md
  - Interface & Settings: interface-guide.md
  - Scene Extensions: scene-extensions.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

use_directory_urls: false

plugins:
  - search:
      lang: en

extra:
  alternate:
    - name: English
      lang: en
      link: /blender/en/
    - name: 中文
      lang: zh
      link: /blender/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bb-yi/blender

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
